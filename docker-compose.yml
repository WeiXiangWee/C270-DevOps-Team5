services:

  # ==========================================
  # Node.js / Express Application
  # Connects to AWS RDS MySQL using .env
  # ==========================================
  app:
    build: .
    container_name: c270-app

    ports:
      - "3000:3000"

    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=3000
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}

    restart: unless-stopped


  # ==========================================
  # Nginx Reverse Proxy
  # Users access through port 80
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: c270-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    restart: unless-stopped