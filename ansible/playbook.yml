- name: Configure AWS EC2 Server
  hosts: web
  become: yes

  tasks:

    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - git
          - curl
        state: present

    - name: Install Docker
      apt:
        name:
          - docker.io
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install Docker Compose plugin
      apt:
        name:
          - docker-compose-v2
        state: present
